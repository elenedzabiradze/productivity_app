<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity Tracker</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e3e5e9;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #3563e9;
    --accent-dark: #2748b3;
    --green: #1f9d55;
    --red: #d64545;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 56px auto;
    padding: 0 20px;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .card + .card {
    margin-top: 24px;
  }

  .tracker {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  #taskInput {
    flex: 1;
    min-width: 160px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    transition: border-color 0.15s ease;
  }

  #taskInput:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }

  #categorySelect {
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    color: var(--text);
  }

  button {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease;
  }

  button:active:not(:disabled) {
    transform: scale(0.98);
  }

  button:hover:not(:disabled) {
    opacity: 0.9;
  }

  #startBtn {
    background: var(--green);
    color: white;
  }

  #stopBtn {
    background: var(--red);
    color: white;
  }

  button:disabled {
    background: #e5e7eb;
    color: #9ca3af;
    cursor: not-allowed;
  }

  #status {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #status:empty {
    display: none;
  }

  #elapsed {
    font-family: 'SF Mono', 'Courier New', monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--green);
    background: #eafaf0;
    padding: 3px 8px;
    border-radius: 6px;
  }

  h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 10px 8px;
  }

  thead th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid #f0f1f3;
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  tbody tr:hover {
    background: #fafbfc;
  }

  /* Small "×" button at the end of each session row. Grey until hovered. */
  .delete-btn {
    padding: 2px 8px;
    font-size: 16px;
    line-height: 1;
    background: transparent;
    color: #9ca3af;
  }

  .delete-btn:hover:not(:disabled) {
    color: var(--red);
    background: #fdecec;
    opacity: 1;
  }

  /* Pencil button next to the "×" — same size, turns blue on hover. */
  .edit-btn {
    padding: 2px 8px;
    font-size: 15px;
    line-height: 1;
    background: transparent;
    color: #9ca3af;
  }

  .edit-btn:hover:not(:disabled) {
    color: var(--accent);
    background: #e6edff;
    opacity: 1;
  }

  .row-actions {
    white-space: nowrap;
    text-align: right;
  }

  /* Pop-up form for editing a session (uses the built-in <dialog> element). */
  #editDialog {
    width: min(420px, calc(100vw - 32px));
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(16, 24, 40, 0.18);
    color: var(--text);
  }

  #editDialog::backdrop {
    background: rgba(16, 24, 40, 0.35);
  }

  #editForm label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 12px;
  }

  #editForm input,
  #editForm select {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
  }

  #editForm input:focus,
  #editForm select:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }

  #editError {
    color: var(--red);
    font-size: 13px;
    margin: 0 0 12px;
  }

  #editError:empty {
    display: none;
  }

  .edit-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  #editCancel {
    background: #eef0f3;
    color: var(--text);
  }

  #editSave {
    background: var(--accent);
    color: white;
  }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-work { background: #e6edff; color: var(--accent-dark); }
  .badge-study { background: #fef3d6; color: #9a6b00; }
  .badge-break { background: #e3f6e9; color: #1f7a45; }
  .badge-other { background: #ececee; color: #52525b; }

  .totals-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .totals-header h2 {
    margin: 0;
  }

  #rangeSelect {
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    color: var(--text);
  }

  /* From/To date boxes, shown only when "Custom…" is picked. */
  #customRange {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  #customRange[hidden] {
    display: none;
  }

  #customRange label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #customRange input {
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    color: var(--text);
  }

  .totals-message {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .totals-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f1f3;
  }

  .totals-row:last-child {
    border-bottom: none;
  }

  .totals-row.totals-total {
    border-top: 1px solid var(--border);
    margin-top: 4px;
    padding-top: 12px;
    font-weight: 700;
  }

  .totals-duration {
    font-family: 'SF Mono', 'Courier New', monospace;
    font-size: 13px;
    color: var(--text);
  }

  #emptyMsg {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
</style>
</head>
<body>

<h1>Productivity Tracker</h1>
<p class="subtitle">Track what you're working on, one session at a time.</p>

<div class="card">
  <div class="tracker">
    <input type="text" id="taskInput" placeholder="What are you working on?">
    <select id="categorySelect">
      <option value="Work">Work</option>
      <option value="Study">Study</option>
      <option value="Break">Break</option>
      <option value="Other">Other</option>
    </select>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <div id="status"></div>
</div>

<div class="card">
  <div class="totals-header">
    <h2>Totals by Category</h2>
    <select id="rangeSelect">
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
      <option value="all">All Time</option>
      <option value="custom">Custom…</option>
    </select>
  </div>
  <div id="customRange" hidden>
    <label>From <input type="date" id="fromDate"></label>
    <label>To <input type="date" id="toDate"></label>
  </div>
  <div id="totalsList"></div>
</div>

<div class="card">
  <h2>Session History</h2>
  <p id="emptyMsg">No sessions recorded yet.</p>
  <table id="sessionsTable" style="display: none;">
    <thead>
      <tr>
        <th>Task</th>
        <th>Category</th>
        <th>Date</th>
        <th>Start</th>
        <th>End</th>
        <th>Duration</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="sessionsBody"></tbody>
  </table>
</div>

<!-- Pop-up form for editing a past session. Hidden until ✎ is clicked. -->
<dialog id="editDialog">
  <form id="editForm">
    <h2>Edit Session</h2>
    <label>Task
      <input type="text" id="editTask" required>
    </label>
    <label>Category
      <select id="editCategory">
        <option value="Work">Work</option>
        <option value="Study">Study</option>
        <option value="Break">Break</option>
        <option value="Other">Other</option>
      </select>
    </label>
    <label>Start
      <input type="datetime-local" id="editStart" step="1" required>
    </label>
    <label>End
      <input type="datetime-local" id="editEnd" step="1" required>
    </label>
    <p id="editError"></p>
    <div class="edit-actions">
      <button type="button" id="editCancel">Cancel</button>
      <button type="submit" id="editSave">Save</button>
    </div>
  </form>
</dialog>

<script>
  // Sessions are persisted on disk by the local server (see server.js),
  // loaded into this array when the page opens.
  let currentSession = null; // { task, category, startTime }
  let timerInterval = null;
  let sessions = [];

  const taskInput = document.getElementById('taskInput');
  const categorySelect = document.getElementById('categorySelect');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const sessionsBody = document.getElementById('sessionsBody');
  const sessionsTable = document.getElementById('sessionsTable');
  const emptyMsg = document.getElementById('emptyMsg');
  const rangeSelect = document.getElementById('rangeSelect');
  const totalsList = document.getElementById('totalsList');

  const CATEGORIES = ['Work', 'Study', 'Break', 'Other'];

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function formatDate(date) {
    return date.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  // Fixed-width HH:MM:SS, used for the live-updating timer while a session is running.
  function formatElapsed(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  function categoryBadge(category) {
    return `<span class="badge badge-${category.toLowerCase()}">${category}</span>`;
  }

  function formatDuration(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const parts = [];
    if (hours > 0) parts.push(hours + 'h');
    if (minutes > 0) parts.push(minutes + 'm');
    parts.push(seconds + 's');
    return parts.join(' ');
  }

  // --- Totals-by-category card ---
  // The server does the adding up (GET /api/totals, see server.js), including
  // the date rules like "this week starts on Monday". The page just asks for
  // the selected range and draws whatever comes back.

  // Counts requests so a slow, outdated reply can't overwrite a newer one
  // (e.g. if you flip the dropdown quickly from "Today" to "All Time").
  let totalsRequestId = 0;

  const customRange = document.getElementById('customRange');
  const fromDate = document.getElementById('fromDate');
  const toDate = document.getElementById('toDate');

  // Shows a plain message in the totals card instead of the numbers.
  function showTotalsMessage(text) {
    totalsList.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'totals-message';
    p.textContent = text;
    totalsList.appendChild(p);
  }

  // Builds the "?..." part of the /api/totals URL for the current selection.
  // Date boxes give values like "2026-11-16", the exact format the server wants.
  function totalsQuery() {
    if (rangeSelect.value !== 'custom') {
      return '?range=' + encodeURIComponent(rangeSelect.value);
    }
    const params = new URLSearchParams();
    if (fromDate.value) params.set('from', fromDate.value);
    if (toDate.value) params.set('to', toDate.value);
    return '?' + params.toString(); // both empty = all time
  }

  async function renderTotals() {
    const requestId = ++totalsRequestId;

    // Catch a backwards range here, with a friendlier message than the server's.
    // ("YYYY-MM-DD" text sorts in date order, so comparing strings works.)
    if (rangeSelect.value === 'custom' && fromDate.value && toDate.value &&
        fromDate.value > toDate.value) {
      showTotalsMessage('The "From" date needs to be on or before the "To" date.');
      return;
    }

    let res, data;
    try {
      res = await fetch('/api/totals' + totalsQuery());
      data = await res.json();
    } catch (err) {
      console.error('Could not load totals from the server:', err);
      if (requestId === totalsRequestId) {
        showTotalsMessage('Could not load totals — make sure the server is running (node server.js).');
      }
      return;
    }

    // A newer request was started while we waited — let that one draw instead.
    if (requestId !== totalsRequestId) return;

    // The server is running but didn't like the request (e.g. a bad date).
    if (!res.ok) {
      showTotalsMessage(data.error || 'Could not load totals.');
      return;
    }

    const totals = data.totals;
    const grandTotal = data.totalMs;

    totalsList.innerHTML = CATEGORIES.map(c => `
      <div class="totals-row">
        ${categoryBadge(c)}
        <span class="totals-duration">${formatDuration(totals[c])}</span>
      </div>
    `).join('') + `
      <div class="totals-row totals-total">
        <span>Total</span>
        <span class="totals-duration">${formatDuration(grandTotal)}</span>
      </div>
    `;
  }

  // Today's date as "YYYY-MM-DD" in local time, for filling the date boxes.
  function todayInputValue() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  rangeSelect.addEventListener('change', () => {
    const isCustom = rangeSelect.value === 'custom';
    customRange.hidden = !isCustom;
    // The first time "Custom…" is picked, start both boxes at today.
    if (isCustom && !fromDate.value && !toDate.value) {
      fromDate.value = todayInputValue();
      toDate.value = todayInputValue();
    }
    renderTotals();
  });

  // 'change' fires once a full date has been picked or typed.
  fromDate.addEventListener('change', renderTotals);
  toDate.addEventListener('change', renderTotals);

  // Load previously saved sessions from the server when the page opens.
  async function loadSessions() {
    try {
      const res = await fetch('/api/sessions');
      const data = await res.json();
      // Dates travel as plain strings over JSON — turn them back into Date objects.
      sessions = data.map(s => ({
        ...s,
        startTime: new Date(s.startTime),
        endTime: new Date(s.endTime)
      }));
      renderSessions();
    } catch (err) {
      console.error('Could not load sessions from the server:', err);
      statusEl.textContent = 'Could not connect to the server — make sure it is running (node server.js).';
    }
  }

  startBtn.addEventListener('click', () => {
    const task = taskInput.value.trim();
    if (!task) {
      alert('Please enter what you\'re working on first.');
      return;
    }

    currentSession = {
      task: task,
      category: categorySelect.value,
      startTime: new Date()
    };

    statusEl.innerHTML = `Working on "${task}" [${currentSession.category}] — started at ${formatTime(currentSession.startTime)} &nbsp; <span id="elapsed">00:00:00</span>`;

    taskInput.disabled = true;
    categorySelect.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;

    // Update the elapsed-time display every second while this session runs.
    timerInterval = setInterval(() => {
      const elapsedEl = document.getElementById('elapsed');
      if (elapsedEl && currentSession) {
        elapsedEl.textContent = formatElapsed(new Date() - currentSession.startTime);
      }
    }, 1000);
  });

  stopBtn.addEventListener('click', async () => {
    if (!currentSession) return;

    clearInterval(timerInterval);
    timerInterval = null;

    const endTime = new Date();
    const durationMs = endTime - currentSession.startTime;

    const newSession = {
      task: currentSession.task,
      category: currentSession.category,
      startTime: currentSession.startTime,
      endTime: endTime,
      durationMs: durationMs
    };

    // Save it to sessions.json via the server, so it's still there next time
    // the app is opened.
    try {
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newSession)
      });
      const saved = await res.json();
      if (!res.ok) {
        // The server is running but refused the session (e.g. end before
        // start). Don't add it to the list — `saved` is an error, not a session.
        alert('This session was not saved: ' + (saved.error || 'the server rejected it.'));
      } else {
        sessions.push({
          ...saved,
          startTime: new Date(saved.startTime),
          endTime: new Date(saved.endTime)
        });
      }
    } catch (err) {
      console.error('Could not save session to the server:', err);
      alert('Could not save this session — the server might not be running. ' +
            'It will show up for now, but will be lost on refresh.');
      sessions.push(newSession);
    }

    renderSessions();

    currentSession = null;
    statusEl.textContent = '';
    taskInput.value = '';
    taskInput.disabled = false;
    categorySelect.disabled = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  });

  function renderSessions() {
    renderTotals();

    if (sessions.length === 0) {
      emptyMsg.style.display = 'block';
      sessionsTable.style.display = 'none';
      return;
    }

    emptyMsg.style.display = 'none';
    sessionsTable.style.display = 'table';

    // Show most recent session first
    sessionsBody.innerHTML = '';
    for (let i = sessions.length - 1; i >= 0; i--) {
      const s = sessions[i];
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${s.task}</td>
        <td>${categoryBadge(s.category)}</td>
        <td>${formatDate(s.startTime)}</td>
        <td>${formatTime(s.startTime)}</td>
        <td>${formatTime(s.endTime)}</td>
        <td>${formatDuration(s.durationMs)}</td>
      `;

      // Edit and delete buttons — only for sessions the server knows about (they
      // have an id). A session kept only in the page after a failed save has none.
      const actionCell = document.createElement('td');
      actionCell.className = 'row-actions';
      if (s.id) {
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = '✎';
        editBtn.title = 'Edit this session';
        editBtn.addEventListener('click', () => openEditDialog(s));
        actionCell.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.title = 'Delete this session';
        deleteBtn.addEventListener('click', () => deleteSession(s));
        actionCell.appendChild(deleteBtn);
      }
      row.appendChild(actionCell);

      sessionsBody.appendChild(row);
    }
  }

  // Asks for confirmation, tells the server to delete the session, then
  // removes it from the page and refreshes the table and totals.
  async function deleteSession(s) {
    if (!confirm(`Delete "${s.task}"? This can't be undone.`)) return;

    try {
      const res = await fetch('/api/sessions/' + encodeURIComponent(s.id), { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || 'Request failed');
      }
    } catch (err) {
      console.error('Could not delete session:', err);
      alert('Could not delete this session: ' + err.message);
      return;
    }

    sessions = sessions.filter(other => other.id !== s.id);
    renderSessions();
  }

  // --- Editing a session ---

  const editDialog = document.getElementById('editDialog');
  const editForm = document.getElementById('editForm');
  const editTask = document.getElementById('editTask');
  const editCategory = document.getElementById('editCategory');
  const editStart = document.getElementById('editStart');
  const editEnd = document.getElementById('editEnd');
  const editError = document.getElementById('editError');
  let sessionBeingEdited = null;

  // Date/time boxes (<input type="datetime-local">) want local time written
  // as "2026-11-21T14:05:09" — no time zone. This builds that text from a Date.
  function toLocalInputValue(date) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
           `T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  function openEditDialog(s) {
    sessionBeingEdited = s;
    editTask.value = s.task;
    editCategory.value = s.category;
    editStart.value = toLocalInputValue(s.startTime);
    editEnd.value = toLocalInputValue(s.endTime);
    editError.textContent = '';
    editDialog.showModal();
  }

  document.getElementById('editCancel').addEventListener('click', () => editDialog.close());

  editForm.addEventListener('submit', async (event) => {
    event.preventDefault(); // stay on the page instead of the browser submitting the form

    const changes = {
      task: editTask.value,
      category: editCategory.value,
      // A datetime-local value with no time zone is read as local time,
      // then toISOString() converts it to the UTC format we store.
      startTime: new Date(editStart.value).toISOString(),
      endTime: new Date(editEnd.value).toISOString()
    };

    try {
      const res = await fetch('/api/sessions/' + encodeURIComponent(sessionBeingEdited.id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes)
      });
      const data = await res.json();
      if (!res.ok) {
        // e.g. "endTime cannot be before startTime" — show it and keep the form open.
        editError.textContent = data.error || 'Could not save changes.';
        return;
      }

      // Swap the old session for the updated one from the server.
      const updated = { ...data, startTime: new Date(data.startTime), endTime: new Date(data.endTime) };
      sessions = sessions.map(other => other.id === updated.id ? updated : other);
      editDialog.close();
      renderSessions();
    } catch (err) {
      console.error('Could not save edit:', err);
      editError.textContent = 'Could not reach the server — make sure it is running (node server.js).';
    }
  });

  loadSessions();
</script>

</body>
</html>
