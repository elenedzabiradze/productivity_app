<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productivity Tracker</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e3e5e9;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #3563e9;
    --accent-dark: #2748b3;
    --green: #1f9d55;
    --red: #d64545;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 56px auto;
    padding: 0 20px;
    color: var(--text);
    background: var(--bg);
    line-height: 1.5;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .card + .card {
    margin-top: 24px;
  }

  .tracker {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  #taskInput {
    flex: 1;
    min-width: 160px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    transition: border-color 0.15s ease;
  }

  #taskInput:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }

  #categorySelect {
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    color: var(--text);
  }

  button {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease;
  }

  button:active:not(:disabled) {
    transform: scale(0.98);
  }

  button:hover:not(:disabled) {
    opacity: 0.9;
  }

  #startBtn {
    background: var(--green);
    color: white;
  }

  #stopBtn {
    background: var(--red);
    color: white;
  }

  button:disabled {
    background: #e5e7eb;
    color: #9ca3af;
    cursor: not-allowed;
  }

  #status {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #status:empty {
    display: none;
  }

  #elapsed {
    font-family: 'SF Mono', 'Courier New', monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--green);
    background: #eafaf0;
    padding: 3px 8px;
    border-radius: 6px;
  }

  h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 10px 8px;
  }

  thead th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid #f0f1f3;
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  tbody tr:hover {
    background: #fafbfc;
  }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-work { background: #e6edff; color: var(--accent-dark); }
  .badge-study { background: #fef3d6; color: #9a6b00; }
  .badge-break { background: #e3f6e9; color: #1f7a45; }
  .badge-other { background: #ececee; color: #52525b; }

  .totals-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .totals-header h2 {
    margin: 0;
  }

  #rangeSelect {
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfbfc;
    color: var(--text);
  }

  .totals-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f1f3;
  }

  .totals-row:last-child {
    border-bottom: none;
  }

  .totals-row.totals-total {
    border-top: 1px solid var(--border);
    margin-top: 4px;
    padding-top: 12px;
    font-weight: 700;
  }

  .totals-duration {
    font-family: 'SF Mono', 'Courier New', monospace;
    font-size: 13px;
    color: var(--text);
  }

  #emptyMsg {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
</style>
</head>
<body>

<h1>Productivity Tracker</h1>
<p class="subtitle">Track what you're working on, one session at a time.</p>

<div class="card">
  <div class="tracker">
    <input type="text" id="taskInput" placeholder="What are you working on?">
    <select id="categorySelect">
      <option value="Work">Work</option>
      <option value="Study">Study</option>
      <option value="Break">Break</option>
      <option value="Other">Other</option>
    </select>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <div id="status"></div>
</div>

<div class="card">
  <div class="totals-header">
    <h2>Totals by Category</h2>
    <select id="rangeSelect">
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
      <option value="all">All Time</option>
    </select>
  </div>
  <div id="totalsList"></div>
</div>

<div class="card">
  <h2>Session History</h2>
  <p id="emptyMsg">No sessions recorded yet.</p>
  <table id="sessionsTable" style="display: none;">
    <thead>
      <tr>
        <th>Task</th>
        <th>Category</th>
        <th>Date</th>
        <th>Start</th>
        <th>End</th>
        <th>Duration</th>
      </tr>
    </thead>
    <tbody id="sessionsBody"></tbody>
  </table>
</div>

<script>
  // Sessions are persisted on disk by the local server (see server.js),
  // loaded into this array when the page opens.
  let currentSession = null; // { task, category, startTime }
  let timerInterval = null;
  let sessions = [];

  const taskInput = document.getElementById('taskInput');
  const categorySelect = document.getElementById('categorySelect');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const sessionsBody = document.getElementById('sessionsBody');
  const sessionsTable = document.getElementById('sessionsTable');
  const emptyMsg = document.getElementById('emptyMsg');
  const rangeSelect = document.getElementById('rangeSelect');
  const totalsList = document.getElementById('totalsList');

  const CATEGORIES = ['Work', 'Study', 'Break', 'Other'];

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function formatDate(date) {
    return date.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  // Fixed-width HH:MM:SS, used for the live-updating timer while a session is running.
  function formatElapsed(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  function categoryBadge(category) {
    return `<span class="badge badge-${category.toLowerCase()}">${category}</span>`;
  }

  function formatDuration(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const parts = [];
    if (hours > 0) parts.push(hours + 'h');
    if (minutes > 0) parts.push(minutes + 'm');
    parts.push(seconds + 's');
    return parts.join(' ');
  }

  // --- Date-range helpers for the totals-by-category card ---

  function startOfToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function startOfWeek() {
    // Treats Monday as the first day of the week.
    const d = startOfToday();
    const day = d.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
    const diffToMonday = (day === 0) ? 6 : day - 1;
    d.setDate(d.getDate() - diffToMonday);
    return d;
  }

  function startOfMonth() {
    const d = startOfToday();
    d.setDate(1);
    return d;
  }

  function rangeStartFor(rangeValue) {
    if (rangeValue === 'today') return startOfToday();
    if (rangeValue === 'week') return startOfWeek();
    if (rangeValue === 'month') return startOfMonth();
    return null; // 'all' — no lower bound
  }

  // Recomputes and redraws the per-category totals for whatever range
  // is currently selected in the dropdown.
  function renderTotals() {
    const rangeStart = rangeStartFor(rangeSelect.value);

    const totals = {};
    CATEGORIES.forEach(c => { totals[c] = 0; });

    let grandTotal = 0;
    sessions.forEach(s => {
      if (!rangeStart || s.startTime >= rangeStart) {
        totals[s.category] = (totals[s.category] || 0) + s.durationMs;
        grandTotal += s.durationMs;
      }
    });

    totalsList.innerHTML = CATEGORIES.map(c => `
      <div class="totals-row">
        ${categoryBadge(c)}
        <span class="totals-duration">${formatDuration(totals[c])}</span>
      </div>
    `).join('') + `
      <div class="totals-row totals-total">
        <span>Total</span>
        <span class="totals-duration">${formatDuration(grandTotal)}</span>
      </div>
    `;
  }

  rangeSelect.addEventListener('change', renderTotals);

  // Load previously saved sessions from the server when the page opens.
  async function loadSessions() {
    try {
      const res = await fetch('/api/sessions');
      const data = await res.json();
      // Dates travel as plain strings over JSON — turn them back into Date objects.
      sessions = data.map(s => ({
        ...s,
        startTime: new Date(s.startTime),
        endTime: new Date(s.endTime)
      }));
      renderSessions();
    } catch (err) {
      console.error('Could not load sessions from the server:', err);
      statusEl.textContent = 'Could not connect to the server — make sure it is running (node server.js).';
    }
  }

  startBtn.addEventListener('click', () => {
    const task = taskInput.value.trim();
    if (!task) {
      alert('Please enter what you\'re working on first.');
      return;
    }

    currentSession = {
      task: task,
      category: categorySelect.value,
      startTime: new Date()
    };

    statusEl.innerHTML = `Working on "${task}" [${currentSession.category}] — started at ${formatTime(currentSession.startTime)} &nbsp; <span id="elapsed">00:00:00</span>`;

    taskInput.disabled = true;
    categorySelect.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;

    // Update the elapsed-time display every second while this session runs.
    timerInterval = setInterval(() => {
      const elapsedEl = document.getElementById('elapsed');
      if (elapsedEl && currentSession) {
        elapsedEl.textContent = formatElapsed(new Date() - currentSession.startTime);
      }
    }, 1000);
  });

  stopBtn.addEventListener('click', async () => {
    if (!currentSession) return;

    clearInterval(timerInterval);
    timerInterval = null;

    const endTime = new Date();
    const durationMs = endTime - currentSession.startTime;

    const newSession = {
      task: currentSession.task,
      category: currentSession.category,
      startTime: currentSession.startTime,
      endTime: endTime,
      durationMs: durationMs
    };

    // Save it to sessions.json via the server, so it's still there next time
    // the app is opened.
    try {
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newSession)
      });
      const saved = await res.json();
      sessions.push({
        ...saved,
        startTime: new Date(saved.startTime),
        endTime: new Date(saved.endTime)
      });
    } catch (err) {
      console.error('Could not save session to the server:', err);
      alert('Could not save this session — the server might not be running. ' +
            'It will show up for now, but will be lost on refresh.');
      sessions.push(newSession);
    }

    renderSessions();

    currentSession = null;
    statusEl.textContent = '';
    taskInput.value = '';
    taskInput.disabled = false;
    categorySelect.disabled = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  });

  function renderSessions() {
    renderTotals();

    if (sessions.length === 0) {
      emptyMsg.style.display = 'block';
      sessionsTable.style.display = 'none';
      return;
    }

    emptyMsg.style.display = 'none';
    sessionsTable.style.display = 'table';

    // Show most recent session first
    sessionsBody.innerHTML = '';
    for (let i = sessions.length - 1; i >= 0; i--) {
      const s = sessions[i];
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${s.task}</td>
        <td>${categoryBadge(s.category)}</td>
        <td>${formatDate(s.startTime)}</td>
        <td>${formatTime(s.startTime)}</td>
        <td>${formatTime(s.endTime)}</td>
        <td>${formatDuration(s.durationMs)}</td>
      `;
      sessionsBody.appendChild(row);
    }
  }

  loadSessions();
</script>

</body>
</html>
